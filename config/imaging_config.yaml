imaging:
  # Target image dimensions
  target_size:
    - 96
    - 96
    - 96
  
  # Normalization
  normalization:
    method: "min_max"  # 'min_max', 'zscore', 'robust'
    min_value: 0
    max_value: 1
  
  # Resampling
  resampling:
    method: "linear"  # 'linear', 'nearest', 'cubic'
    voxel_spacing: null  # null for auto-detect
  
  # Preprocessing
  preprocessing:
    skull_strip: false  # Set to true if skull stripping available
    brain_mask: false
    registration_template: null  # null for none
    smoothing_kernel: null  # null for no smoothing
    smoothing_fwhm: 4  # mm

mri:
  # MRI-specific settings
  modality: "T1w"  # 'T1w', 'T2w', 'FLAIR', etc.
  
  orientation_handling:
    ensure_rpi: true
    reorient_as_standard: true
  
  intensity_normalization:
    method: "robust"  # 'robust', 'z_score', 'min_max'
  
  # Output format
  output_format: "tensor"  # 'tensor', 'nifti'
  
  # Supported file formats
  supported_formats:
    - .nii
    - .nii.gz
    - .dcm

fmri:
  # fMRI-specific settings
  modality: "bold"
  
  # Temporal processing
  temporal_processing:
    tr: null  # seconds (auto-detect from header)
    high_pass_filter: 0.01  # Hz
    low_pass_filter: 0.1   # Hz
    detrending: "linear"
  
  # Smoothing (optional)
  smoothing:
    apply: false
    kernel_fwhm: 6  # mm
  
  # ROI extraction
  roi_atlas: "AAL90"  # 'AAL90', 'AAL116', 'Power264', 'Schaefer400'
  extract_roi_timeseries: true
  
  # Functional connectivity
  connectivity_measures:
    - "correlation"
    - "partial_correlation"
    - "covariance"
  
  # Output format
  output_format: "tensor"  # 'tensor', 'connectivity_matrix'
  
  # Supported file formats
  supported_formats:
    - .nii
    - .nii.gz

ct:
  # CT-specific settings
  modality: "head"  # 'head', 'body', 'chest'
  
  # Windowing (Hounsfield units)
  windowing:
    apply: true
    window_center: 40  # Brain window: center 40
    window_width: 80   # Brain window: width 80
  
  # Intensity normalization
  normalization:
    method: "hu_based"  # 'hu_based', 'min_max', 'zscore'
    hu_min: -1000  # Hounsfield units
    hu_max: 3000
  
  # Output format
  output_format: "tensor"  # 'tensor', 'nifti'
  
  # Supported file formats
  supported_formats:
    - .dcm
    - .nii
    - .nii.gz

# Model input specifications
model_input:
  # Data type
  dtype: "float32"  # 'float32', 'float64'
  
  # Batch normalization
  use_batch_norm: true
  batch_norm_momentum: 0.1
  batch_norm_epsilon: 1e-5

# Visualization
visualization:
  slices:
    - "axial"
    - "sagittal"
    - "coronal"
  
  slice_indices:
    axial: "mid"  # 'first', 'mid', 'last' or integer
    sagittal: "mid"
    coronal: "mid"
  
  colormap: "viridis"  # matplotlib colormap
  alpha: 0.7  # transparency for overlays
